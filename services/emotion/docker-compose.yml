services:
  ave-emotion:
    build: .
    ports:
      - "8092:8092"
    restart: unless-stopped
    cpus: 2
    environment:
      - OMP_NUM_THREADS=2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
